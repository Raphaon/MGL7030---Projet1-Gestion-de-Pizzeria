<section class="section container">
    <h4 class="center-align page-title">Personnalisez votre pizza</h4>

    <div class="row">
        <div class="col s12 m6">
            <div class="card">
                <div class="card-content">
                    <span class="card-title">Garnitures</span>
                    <table class="table-garniture">
                        <thead>
                            <tr>
                                <th>Viande <small class="grey-text">(une seule)</small></th>
                                <th>Legumes <small class="grey-text">(plusieurs)</small></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col s12 m6">
            <div class="card">
                <div class="card-content">
                    <span class="card-title">Format</span>
                    <table class="table-format">
                        <tbody></tbody>
                    </table>
                </div>
                <div class="card-action center-align">
                    <button id="orderBtn" class="btn btn-large waves-effect waves-light red darken-2">
                        <i class="material-icons left">add_shopping_cart</i>Commander
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col s12">
            <div class="card">
                <div class="card-content">
                    <span class="card-title">Mes commandes</span>
                    <table class="striped responsive-table highlight">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Format</th>
                                <th>Viande</th>
                                <th>Legumes</th>
                                <th>Prix ($)</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody class="command-item">
                            <tr><td colspan="6" class="center-align">Aucune commande.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
