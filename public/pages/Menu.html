<section class="section container menu-page">
    <div class="menu-heading">
        <div>
            <h4 class="page-title">Notre menu</h4>
            <p class="grey-text text-darken-1">Choisissez une pizza pour consulter sa description, ses ingredients et son prix de depart.</p>
        </div>
        <a href="/commander" class="btn red darken-2 waves-effect waves-light">
            <i class="material-icons left">add_shopping_cart</i>Commander
        </a>
    </div>

    <div id="menuStatus" class="menu-status">Chargement du menu...</div>

    <div class="menu-content" id="menuContent" hidden>
        <div class="pizza-grid" id="pizzaList" aria-label="Liste des pizzas"></div>

        <aside class="pizza-panel" aria-live="polite">
            <img id="pizzaImage"
                 src="/Assets/Images/pizzas/fallback.svg"
                 alt="Pizza">
            <div class="pizza-panel-body">
                <div class="pizza-panel-topline">
                    <span id="pizzaType" class="pizza-type"></span>
                    <span id="pizzaPrice" class="pizza-price"></span>
                </div>
                <h5 id="pizzaName">Selectionnez une pizza</h5>
                <p id="pizzaDescription" class="grey-text text-darken-2"></p>
                <div>
                    <strong>Ingredients</strong>
                    <div id="pizzaIngredients" class="ingredient-list"></div>
                </div>
            </div>
        </aside>
    </div>
</section>
