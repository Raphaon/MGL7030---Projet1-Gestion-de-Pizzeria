<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — Pizzeria</title>
    
</head>
<body>
    <div class="card">
        <h1>Inscription</h1>
        <p class="lead">Créez un compte administrateur.</p>
        <div id="message" class="message"></div>
        <form id="registerForm">
            <label for="nom_utilisateur">Nom d'utilisateur</label>
            <input type="text" id="nom_utilisateur" name="nom_utilisateur" required autocomplete="username" placeholder="admin">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@example.com">

            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="new-password" placeholder="••••••••">

            <button type="submit">Créer un compte</button>
        </form>
        <p class="footer-text">Déjà inscrit ? <a href="/api/login">Se connecter</a></p>
    </div>
    <script>
        const messageEl = document.getElementById('message');
        const form = document.getElementById('registerForm');

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const data = {
                nom_utilisateur: document.getElementById('nom_utilisateur').value.trim(),
                email: document.getElementById('email').value.trim(),
                mot_de_passe: document.getElementById('mot_de_passe').value.trim()
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (!response.ok) {
                    showMessage(result.error || 'Inscription impossible.', 'error');
                    return;
                }
                showMessage('Compte créé avec succès.', 'success');
                form.reset();
            } catch (err) {
                showMessage('Erreur réseau, veuillez réessayer.', 'error');
            }
        });
    </script>
</body>
</html>
